name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AETHER_PASSWORD: ${{ secrets.AETHER_SIGNING_PASSWORD }}
      KEY_ENC: signing/aether.p12.enc
      KEY_FILE: ${{ github.workspace }}/../aether.p12
    steps:
      - uses: actions/checkout@v4

      - name: Check password secret
        run: |
          if [ -z "$AETHER_PASSWORD" ]; then
            echo "::error::Add the AETHER_SIGNING_PASSWORD secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create signing key (first run only)
        run: |
          if [ ! -f "$KEY_ENC" ]; then
            keytool -genkeypair -keystore "$KEY_FILE" -storetype PKCS12 -alias aether \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=AETHER" \
              -storepass "$AETHER_PASSWORD" -keypass "$AETHER_PASSWORD"
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -in "$KEY_FILE" -out "$KEY_ENC" -pass env:AETHER_PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add "$KEY_ENC"
            git commit -m "Add encrypted signing key"
            git push
          fi

      - name: Unlock signing key
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$KEY_ENC" -out "$KEY_FILE" -pass env:AETHER_PASSWORD

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          AETHER_KEYSTORE_FILE: ${{ github.workspace }}/../aether.p12
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_SIGNING_PASSWORD }}
          AETHER_KEY_ALIAS: aether
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/AETHER.apk"

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "$RUNNER_TEMP/AETHER.apk" \
            --title "AETHER (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}" \
            --target "$(git rev-parse HEAD)" --latest
            
